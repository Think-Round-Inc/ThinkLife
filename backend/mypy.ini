[mypy]
python_version = 3.11
ignore_missing_imports = True
# Start lenient (Epic 5 / Story 5.2, Task 2.4). The codebase wasn't written
# with strict typing in mind, so turning on strict mode repo-wide today would
# surface hundreds of pre-existing warnings unrelated to this change and make
# the check useless as a CI gate. Instead: no error on existing code, but new
# modules from Epic 5 (config, brain/registry_base, brain/providers/protocol,
# plugins/registry, plugins/echo_agent) opt into stricter checking below.
# Tighten further module-by-module as other parts of the codebase are typed.
disallow_untyped_defs = False
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

[mypy-config.*]
disallow_untyped_defs = True

[mypy-brain.registry_base]
disallow_untyped_defs = True

[mypy-brain.providers.protocol]
disallow_untyped_defs = True

[mypy-plugins.registry]
disallow_untyped_defs = True

[mypy-plugins.echo_agent]
disallow_untyped_defs = True

[mypy-brain.lifecycle]
disallow_untyped_defs = True

[mypy-brain.resilience.*]
disallow_untyped_defs = True

[mypy-background.*]
disallow_untyped_defs = True
